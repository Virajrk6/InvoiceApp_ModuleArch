<div class="login-page">
  <div class="login-card">
    <h2 class="text-center">Invoice Manager</h2>
    <p class="text-muted text-center">Sign in to continue</p>

    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input pInputText class="w-100" placeholder="admin" formControlName="username">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input pInputText type="password" placeholder="admin123" class="w-100" formControlName="password">
      </div>

      <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>

      <button pButton type="submit" label="Login" class="w-100"></button>
    </form>

    <div class="mt-3 small text-muted">
      <!-- Credentials:<strong>admin</strong> <strong>admin123</strong> -->
    </div>
  </div>
</div>
